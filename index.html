<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رأيك يهمنا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #17181a;
      font-family: Arial, Tahoma, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 22px;
      padding: 25px 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    h1 {
      font-size: 28px;
      line-height: 1.4;
      margin: 0 0 10px;
    }

    .intro {
      color: #666;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: white;
      color: #17181a;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #17181a;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .choices {
      display: flex;
      gap: 10px;
    }

    .choice {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #17181a;
      font-size: 16px;
      font-family: inherit;
      margin: 0;
    }

    .choice:hover {
      background: #f7f7f7;
    }

    .choice.selected {
      border: 2px solid #17181a;
      background: #f1f1f1;
    }

    .choice:focus {
      outline: none;
    }

    .choice:active {
      transform: scale(0.98);
    }

    #submitButton {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 24px;
      background: #17181a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    #submitButton:hover {
      background: #000;
    }

    #submitButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 15px;
    }

    .optional {
      font-weight: normal;
      color: #888;
      font-size: 13px;
    }

    .success-message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #f1f1f1;
      text-align: center;
      font-weight: bold;
      line-height: 1.6;
    }

    .error-message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #fff1f1;
      color: #9b0000;
      text-align: center;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="page">

    <main class="card">

      <h1>🥤 شو أطيب مشروب طاقة بالسوق؟</h1>

      <p class="intro">
        مش شرط يكون الأغلى أو الأشهر.
        بدنا نعرف شو المنتج اللي أنت فعلاً بتفضّله.
      </p>

      <label for="product">
        شو المنتج اللي بتفضّله؟
      </label>

      <input
        id="product"
        type="text"
        placeholder="اكتب اسم المنتج"
        maxlength="100"
        autocomplete="off"
      >

      <label for="reason">
        ليش اخترته؟
      </label>

      <textarea
        id="reason"
        placeholder="اكتب السبب باختصار"
        maxlength="500"
      ></textarea>

      <label>
        هل بتشتريه عادة؟
      </label>

      <div class="choices" data-question="usuallyBuy">

        <button type="button" class="choice" data-value="نعم">
          نعم
        </button>

        <button type="button" class="choice" data-value="لا">
          لا
        </button>

      </div>

      <label>
        هل جربت أكثر من نوع؟
      </label>

      <div class="choices" data-question="triedMore">

        <button type="button" class="choice" data-value="نعم">
          نعم
        </button>

        <button type="button" class="choice" data-value="لا">
          لا
        </button>

      </div>

      <label for="province">
        بأي محافظة بتشتري عادة؟
        <span class="optional">(اختياري)</span>
      </label>

      <select id="province">
        <option value="">أفضل عدم الإجابة</option>
        <option value="بيروت">بيروت</option>
        <option value="جبل لبنان">جبل لبنان</option>
        <option value="الشمال">الشمال</option>
        <option value="عكار">عكار</option>
        <option value="البقاع">البقاع</option>
        <option value="بعلبك - الهرمل">بعلبك - الهرمل</option>
        <option value="الجنوب">الجنوب</option>
        <option value="النبطية">النبطية</option>
      </select>

      <button id="submitButton" type="button">
        شارك رأيك
      </button>

      <div class="note">
        🔒 لا نطلب اسمك أو رقمك أو بريدك الإلكتروني.
        إجابتك مجهولة وتُستخدم فقط لفهم آراء المستهلكين.
      </div>

    </main>

  </div>


  <script>

    document.addEventListener("DOMContentLoaded", function () {

      // تخزين الاختيارات
      const selections = {
        usuallyBuy: "",
        triedMore: ""
      };


      // التعامل مع أزرار نعم / لا
      const choiceGroups = document.querySelectorAll(".choices");

      choiceGroups.forEach(function (group) {

        const buttons = group.querySelectorAll(".choice");
        const question = group.dataset.question;

        buttons.forEach(function (button) {

          button.addEventListener("click", function () {

            // إزالة الاختيار السابق
            buttons.forEach(function (otherButton) {
              otherButton.classList.remove("selected");
            });

            // تحديد الاختيار الحالي
            button.classList.add("selected");

            // حفظ الإجابة
            selections[question] = button.dataset.value;

          });

        });

      });


      // زر إرسال الإجابة
      const submitButton = document.getElementById("submitButton");

      submitButton.addEventListener("click", function () {

        const productInput = document.getElementById("product");
        const reasonInput = document.getElementById("reason");
        const provinceInput = document.getElementById("province");

        const product = productInput.value.trim();
        const reason = reasonInput.value.trim();
        const province = provinceInput.value;


        // إزالة الرسائل السابقة
        const oldMessages = document.querySelectorAll(
          ".success-message, .error-message"
        );

        oldMessages.forEach(function (message) {
          message.remove();
        });


        // التحقق من اسم المنتج
        if (!product) {

          showMessage(
            "⚠️ اكتب اسم المنتج أولاً.",
            "error-message"
          );

          productInput.focus();
          return;
        }


        // التحقق من السبب
        if (!reason) {

          showMessage(
            "⚠️ اكتب سبب اختيارك للمنتج.",
            "error-message"
          );

          reasonInput.focus();
          return;
        }


        // التحقق من سؤال الشراء
        if (!selections.usuallyBuy) {

          showMessage(
            "⚠️ اختر إذا كنت تشتري المنتج عادة أم لا.",
            "error-message"
          );

          return;
        }


        // التحقق من سؤال تجربة أكثر من نوع
        if (!selections.triedMore) {

          showMessage(
            "⚠️ اختر إذا كنت جربت أكثر من نوع أم لا.",
            "error-message"
          );

          return;
        }


        // إنشاء الإجابة
        const answer = {
          product: product,
          reason: reason,
          usuallyBuy: selections.usuallyBuy,
          triedMore: selections.triedMore,
          province: province,
          date: new Date().toISOString()
        };


        // قراءة الإجابات القديمة
        let oldAnswers = [];

        try {

          const savedAnswers =
            localStorage.getItem("consumerOpinions");

          if (savedAnswers) {
            oldAnswers = JSON.parse(savedAnswers);
          }

          if (!Array.isArray(oldAnswers)) {
            oldAnswers = [];
          }

        } catch (error) {

          oldAnswers = [];

        }


        // إضافة الإجابة الجديدة
        oldAnswers.push(answer);


        // حفظ الإجابات
        try {

          localStorage.setItem(
            "consumerOpinions",
            JSON.stringify(oldAnswers)
          );

        } catch (error) {

          console.error(
            "تعذر حفظ الإجابة:",
            error
          );

        }


        // تعطيل الزر لمنع الإرسال المتكرر
        submitButton.disabled = true;


        // عرض رسالة النجاح
        showMessage(
          "شكراً! ❤️ تم تسجيل رأيك بنجاح.",
          "success-message"
        );

      });


      // وظيفة عرض الرسائل
      function showMessage(text, className) {

        const message = document.createElement("div");

        message.className = className;
        message.innerText = text;

        submitButton.parentElement.appendChild(message);

      }

    });

  </script>

</body>
</html>
